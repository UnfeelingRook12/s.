</style>

const THEMES={Aurora:[210,280,170],Dusk:[330,265,25],Lagoon:[175,205,130],Ember:[18,350,45],Orchid:[290,320,230]};

bands=FR.map((f,i)=>{const b=ctx.createBiquadFilter();b.type=i==0?'lowshelf':i==9?'highshelf':'peaking';b.frequency.value=f;b.Q.value=1.1;n.connect(b);n=b;return b});

function eqApply(){if(!ctx)return;preN.gain.value=E.on?Math.pow(10,E.pre/20):1;bands.forEach((b,i)=>b.gain.value=E.on?E.g[i]:0);comp.ratio.value=E.on?10:1}

/* cover art and tags */
const tagsOf=f=>new Promise(r=>{try{window.jsmediatags.read(f,{onSuccess:t=>r(t.tags||{}),onError:()=>r({})})}catch(e){r({})}});
const hueOf=(r,g,b)=>{r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;if(d<.08)return null;const h=M==r?((g-b)/d)%6:M==g?(b-r)/d+2:(r-g)/d+4;return Math.round((h*60+360)%360)};
function palOf(img){const c=document.createElement('canvas');c.width=c.height=40;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,40,40);const d=x.getImageData(0,0,40,40).data,bins=Array.from({length:12},()=>({w:0,s:0,x:0,y:0}));
for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,M=Math.max(r,g,b),m=Math.min(r,g,b),dl=M-m,l=(M+m)/2;if(dl<.1||l<.12||l>.92)continue;const s=dl/(1-Math.abs(2*l-1));let h=M==r?((g-b)/dl)%6:M==g?(b-r)/dl+2:(r-g)/dl+4;h=(h*60+360)%360;const w=s*(1-Math.abs(2*l-1))+.05,B=bins[Math.floor(h/30)%12];B.w+=w;B.s+=s*w;B.x+=Math.cos(h*Math.PI/180)*w;B.y+=Math.sin(h*Math.PI/180)*w}

const palFor=s=>new Promise(r=>{if(s.pal!==undefined||!covers[s.id])return r();const i=new Image();i.onload=()=>{try{s.pal=palOf(i)}catch(e){}r()};i.onerror=()=>r();i.src=covers[s.id]});

const db=new Promise(r=>{try{const o=indexedDB.open('glassbox',1);o.onupgradeneeded=()=>o.result.createObjectStore('b');o.onsuccess=()=>r(o.result);o.onerror=()=>r(null)}catch(e){r(null)}});

const del=async k=>{try{const d=await db;if(d)d.transaction('b','readwrite').objectStore('b').delete(k)}catch(e){}};
const get=k=>new Promise(async r=>{try{const d=await db;if(!d)return r();const x=d.transaction('b').objectStore('b').get(k);x.onsuccess=()=>r(x.result);x.onerror=()=>r()}catch(e){r()}});
